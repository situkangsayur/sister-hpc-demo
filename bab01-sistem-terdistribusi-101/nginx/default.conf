# Load balancer round robin untuk tiga node identik.
# IP node dibuat tetap di compose.yaml karena nginx membaca nama node sekali saat mulai,
# sehingga node yang crash lalu di-restart tetap dikenali di alamat yang sama.

log_format json_lb escape=json '{"time":"$time_iso8601","service":"nginx","msg":"akses",'
  '"request_id":"$request_id","method":"$request_method","path":"$uri","status":$status,'
  '"upstream":"$upstream_addr","upstream_status":"$upstream_status","node":"$upstream_http_x_node",'
  '"durasi_s":"$request_time","upstream_durasi_s":"$upstream_response_time"}';
access_log /dev/stdout json_lb;

upstream cluster {
    zone cluster 64k;  # status round robin dan kegagalan dibagi antar-worker nginx
    # Passive health check: 2 kegagalan dalam 5 detik membuat node dikeluarkan selama 5 detik.
    server node1:8080 max_fails=2 fail_timeout=5s;
    server node2:8080 max_fails=2 fail_timeout=5s;
    server node3:8080 max_fails=2 fail_timeout=5s;
    keepalive 16;
}

server {
    listen 8080;

    location = /nginx-sehat {
        access_log off;
        default_type text/plain;
        add_header Cache-Control no-store;
        return 200 "ok\n";
    }

    location / {
        proxy_pass http://cluster;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Timeout: tanpa ini, node yang "hang" membuat klien menunggu selamanya (fallacy 1).
        proxy_connect_timeout 500ms;
        proxy_read_timeout 2s;
        proxy_send_timeout 2s;
        # Retry ke node lain hanya untuk kegagalan jaringan. nginx TIDAK mengulang POST yang
        # sudah terkirim (non_idempotent tidak diaktifkan), supaya data tidak tercatat dua kali.
        proxy_next_upstream error timeout;
        proxy_next_upstream_tries 2;
        proxy_next_upstream_timeout 3s;
        # Header untuk UI: daftar node yang dicoba ("a, b" berarti terjadi retry).
        add_header X-Upstream $upstream_addr always;
        add_header X-Request-ID $request_id always;
    }
}
