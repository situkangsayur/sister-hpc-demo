# Observability bersama untuk semua demo: Grafana + Loki + Grafana Alloy.
# Jalankan: docker compose -f shared/observability/compose.yaml up -d
name: sister-obs

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "2"

services:
  loki:
    image: grafana/loki:3.3.2
    command: ["-config.file=/etc/loki/loki.yaml"]
    volumes:
      - ./loki/loki.yaml:/etc/loki/loki.yaml:ro
      - loki-data:/loki
    ports:
      - "${BIND_ADDR:-127.0.0.1}:50001:3100"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:3100/ready | grep -q ready"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    mem_limit: 768m
    logging: *default-logging
    restart: unless-stopped

  alloy:
    image: grafana/alloy:v1.5.1
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    environment:
      LOG_PROJECT_REGEX: ${LOG_PROJECT_REGEX:-sister-.*}
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      # Docker socket read-only: Alloy hanya membaca daftar container dan log-nya.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy/data
    ports:
      - "${BIND_ADDR:-127.0.0.1}:50002:12345"
    depends_on:
      loki:
        condition: service_healthy
    mem_limit: 512m
    logging: *default-logging
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.4.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?isi GRAFANA_ADMIN_PASSWORD di .env}
      # Demo kelas: mahasiswa boleh melihat tanpa login (role Viewer saja).
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_LOG_LEVEL: warn
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/log-per-demo.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      # Dashboard milik bab, tetap disimpan di folder babnya (grafana/*.json), dipasang read-only.
      # Tambah satu baris per bab baru yang punya folder grafana/.
      - ../../bab01-sistem-terdistribusi-101/grafana:/var/lib/grafana/dashboards-bab/bab01:ro
      - ../../bab05-microservices-messaging/grafana:/var/lib/grafana/dashboards-bab/bab05:ro
    # Semua isi Grafana (datasource, dashboard) berasal dari provisioning, jadi database
    # SQLite-nya cukup di tmpfs: start lebih cepat (migrasi tidak menunggu disk) dan tidak
    # memakai disk server. Akibatnya user/preferensi yang dibuat lewat UI hilang saat restart.
    tmpfs:
      - /var/lib/grafana:size=256m,uid=472,gid=0,mode=0770
    ports:
      - "${BIND_ADDR:-127.0.0.1}:50000:3000"
    depends_on:
      loki:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:3000/api/health | grep -q ok"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 15s
    mem_limit: 512m
    logging: *default-logging
    restart: unless-stopped

volumes:
  loki-data:
  alloy-data:
