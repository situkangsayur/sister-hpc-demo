# nginx di depan origin (Bab 3, subbab "Di Depan Server"): TLS termination, HTTP/2,
# load balancer L7 (least_conn + health check pasif), proxy cache dengan revalidasi ETag,
# kompresi gzip, dan HSTS.
worker_processes 1;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events { worker_connections 512; }

http {
    log_format json escape=json '{"time":"$time_iso8601","level":"INFO","msg":"request",'
        '"service":"nginx","request_id":"$request_id","method":"$request_method","path":"$uri",'
        '"status":$status,"proto":"$server_protocol","cache":"$upstream_cache_status",'
        '"upstream":"$upstream_addr","dur_ms":"$request_time"}';
    access_log /dev/stdout json;

    proxy_cache_path /var/cache/nginx/demo levels=1:2 keys_zone=demo:10m max_size=50m
                     inactive=10m use_temp_path=off;

    upstream katalog {
        least_conn;                                     # ke koneksi aktif tersedikit
        server origin-a:8080 max_fails=2 fail_timeout=10s;
        server origin-b:8080 max_fails=2 fail_timeout=10s;
    }

    gzip on;
    gzip_types application/json application/javascript text/css;
    gzip_min_length 256;
    gzip_vary on;
    gzip_proxied any;

    # HTTP polos: hanya mengalihkan ke HTTPS.
    server {
        listen 80;
        location / { return 301 https://$host$request_uri; }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name nginx localhost;
        ssl_certificate     /certs/server.pem;          # leaf + intermediate
        ssl_certificate_key /certs/server-key.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Request-Id $request_id;
        proxy_connect_timeout 1s;
        proxy_read_timeout 5s;                          # jangan menunggu selamanya
        proxy_next_upstream error timeout http_502 http_503;

        # add_header di location menimpa milik server, jadi HSTS ditulis di tiap location.
        location /api/ {
            proxy_pass http://katalog;
            proxy_cache demo;
            proxy_cache_revalidate on;                  # cache basi: tanya origin dengan If-None-Match
            proxy_cache_lock on;
            add_header X-Cache-Status $upstream_cache_status always;
            add_header X-Upstream $upstream_addr always;
            add_header Strict-Transport-Security "max-age=300" always;
        }
        location /static/ {
            proxy_pass http://katalog;
            proxy_cache demo;
            add_header X-Cache-Status $upstream_cache_status always;
            add_header X-Upstream $upstream_addr always;
            add_header Strict-Transport-Security "max-age=300" always;
        }
        location /admin/ { return 403; }               # admin origin hanya dari jaringan internal
        location / {
            add_header Strict-Transport-Security "max-age=300" always;
            return 200 "nginx Bab 3: coba /api/katalog atau /static/app.3f9a1c.js\n";
        }
    }
}
