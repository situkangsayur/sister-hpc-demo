# Application Argo CD: desired state = folder app/ di repo gitops (Gitea), cabang main.
# automated + selfHeal: perubahan di Git langsung di-sync, dan perubahan manual di cluster
# (drift) dikembalikan ke isi Git.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: http://gitea:3000/demo/gitops.git
    targetRevision: main
    path: app
  destination:
    server: https://kubernetes.default.svc
    namespace: demo
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff: { duration: 5s, factor: 2, maxDuration: 1m }
