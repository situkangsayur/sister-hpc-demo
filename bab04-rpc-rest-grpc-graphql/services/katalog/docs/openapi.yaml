openapi: 3.1.0
info:
  title: Katalog (Bab 4, slide P04)
  version: 1.0.0
  description: |
    Layanan katalog yang sama dengan versi gRPC, GraphQL, dan SOAP. Setiap GET bisa
    meminta representasi XML dengan header `Accept: application/xml` (content negotiation).
    Error memakai Problem Details RFC 9457.
servers:
  - url: /
paths:
  /v1/produk:
    get:
      operationId: daftarProduk
      summary: Daftar semua produk
      responses:
        "200":
          description: OK
          content:
            application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Produk" } } }
            application/xml: { schema: { type: array, items: { $ref: "#/components/schemas/Produk" } } }
  /v1/produk/{id}:
    get:
      operationId: ambilProduk
      summary: Ambil satu produk (ETag + If-None-Match didukung)
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 }, example: 42 }
      responses:
        "200":
          description: OK
          headers: { ETag: { schema: { type: string } } }
          content:
            application/json: { schema: { $ref: "#/components/schemas/Produk" } }
            application/xml: { schema: { $ref: "#/components/schemas/Produk" } }
        "304": { description: Tidak berubah sejak ETag yang dikirim }
        "404":
          description: Tidak ditemukan
          content: { application/problem+json: { schema: { $ref: "#/components/schemas/Masalah" } } }
  /v1/produk/{id}/harga:
    put:
      operationId: ubahHarga
      summary: Ubah harga (memicu event SSE/long polling/gRPC stream)
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 }, example: 42 }
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, properties: { harga: { type: integer, example: 26000 } }, required: [harga] } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Produk" } } } }
        "404": { description: Tidak ditemukan }
  /v1/bayar:
    post:
      operationId: bayar
      summary: Bayar (POST aman diulang dengan Idempotency-Key)
      parameters:
        - { name: Idempotency-Key, in: header, required: false, schema: { type: string }, example: 7f3a }
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, properties: { akun: { type: string, example: budi }, jumlah: { type: integer, example: 25000 } }, required: [akun, jumlah] } } }
      responses:
        "201":
          description: Dibayar (atau hasil lama bila header Idempotent-Replayed true)
          headers: { Idempotent-Replayed: { schema: { type: string } } }
          content: { application/json: { schema: { $ref: "#/components/schemas/HasilBayar" } } }
        "409": { description: Kunci sama masih diproses }
        "422": { description: Kunci sama dengan isi berbeda, atau saldo tidak cukup }
        "503": { description: Gangguan buatan (fault injection), belum diproses }
  /v1/saldo/{akun}:
    get:
      operationId: saldo
      parameters: [{ name: akun, in: path, required: true, schema: { type: string }, example: budi }]
      responses: { "200": { description: OK } }
  /v1/harga/stream:
    get:
      operationId: streamHarga
      summary: Server-Sent Events perubahan harga
      parameters: [{ name: id, in: query, schema: { type: string }, example: "42,1" }]
      responses: { "200": { description: text/event-stream } }
  /v1/harga/tunggu:
    get:
      operationId: longPollHarga
      summary: Long polling perubahan harga sesudah waktu tertentu (ms)
      parameters: [{ name: setelah, in: query, schema: { type: integer } }]
      responses: { "200": { description: Ada perubahan }, "204": { description: Habis waktu 25 detik } }
components:
  schemas:
    Produk:
      type: object
      xml: { name: produk }
      required: [id, nama, harga]
      properties:
        id: { type: integer, format: int64, example: 42 }
        nama: { type: string, example: Kopi }
        harga: { type: integer, format: int64, example: 25000 }
    HasilBayar:
      type: object
      properties:
        sisa: { type: integer }
        id_bayar: { type: string }
        dari_cache: { type: boolean }
    Masalah:
      type: object
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
