# nginx sebagai load balancer untuk 2 replica service order.
worker_processes 1;
events { worker_connections 512; }

http {
  log_format json escape=json '{"time":"$time_iso8601","level":"INFO","msg":"nginx access",'
    '"service":"nginx","request_id":"$http_x_request_id","method":"$request_method",'
    '"path":"$uri","status":$status,"upstream":"$upstream_addr",'
    '"upstream_status":"$upstream_status","duration_ms":"$request_time"}';
  access_log /dev/stdout json;
  error_log /dev/stderr warn;

  upstream order {
    # round robin; passive health check: 1 kali gagal -> replica dikeluarkan 5 detik
    server order-1:8080 max_fails=1 fail_timeout=5s;
    server order-2:8080 max_fails=1 fail_timeout=5s;
    keepalive 16;
  }

  server {
    listen 80;

    location = /nginx-health { access_log off; return 200 "ok\n"; }

    location / {
      proxy_pass http://order;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header X-Request-Id $http_x_request_id;
      proxy_connect_timeout 1s;
      proxy_read_timeout 10s;
      # Bila replica menolak koneksi, coba replica berikutnya. POST hanya dicoba ulang bila
      # request belum terkirim ke upstream (aman: belum ada efek).
      proxy_next_upstream error timeout http_502 http_503;
      proxy_next_upstream_tries 2;
      add_header X-Upstream $upstream_addr always;
    }
  }
}
